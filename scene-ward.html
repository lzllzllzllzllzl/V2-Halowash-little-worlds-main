.hud-actions{display:flex;gap:8px;margin-left:auto}
.chip-btn{border-radius:999px;cursor:pointer}
.chip-btn:hover{background:#1d4058f2}

@media(prefers-reduced-motion:reduce){#world{transition:none}#loading{animation:none}}
